[project]
name = "policybuddy"
version = "0.1.0"
description = "AI-powered corporate policy assistant using RAG, LangGraph and Ollama."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Maria Leticia Nascimento" }
]

dependencies = [
    "streamlit>=1.47.0",
    "langchain>=1.3.4",
    "langchain-community>=0.3.27",
    "langchain-ollama>=0.3.6",
    "langgraph>=1.2.4",
    "chromadb>=1.0.16",
    "pypdf>=5.9.0",
    "langchain-text-splitters>=0.3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"